name: CI

on:
  push:
  pull_request:

jobs:
  build:
    name: ${{ matrix.os }} / ${{ matrix.compiler }} / ${{ matrix.build_type }}${{ matrix.sanitize && ' / sanitizers' || '' }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, compiler: gcc,   build_type: Release }
          - { os: ubuntu-latest, compiler: clang, build_type: Release }
          - { os: ubuntu-latest, compiler: clang, build_type: Debug, sanitize: true }
          - { os: macos-latest,  compiler: clang, build_type: Release }

    steps:
      - uses: actions/checkout@v5

      - name: Check out DASHSchema (6th edition examples)
        uses: actions/checkout@v5
        with:
          repository: MPEGGroup/DASHSchema
          ref: 6th-Ed
          path: DASHSchema

      - name: Install dependencies (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libxml2-dev libcurl4-openssl-dev zlib1g-dev

      - name: Configure
        run: |
          if [ "${{ matrix.compiler }}" = "gcc" ]; then export CXX=g++; else export CXX=clang++; fi
          FLAGS=""
          if [ "${{ matrix.sanitize }}" = "true" ]; then FLAGS="-fsanitize=address,undefined -fno-omit-frame-pointer"; fi
          cmake -S libdash -B build \
            -DCMAKE_BUILD_TYPE=${{ matrix.build_type }} \
            -DCMAKE_CXX_FLAGS="$FLAGS" \
            -DCMAKE_SHARED_LINKER_FLAGS="$FLAGS" \
            -DCMAKE_EXE_LINKER_FLAGS="$FLAGS" \
            -DLIBDASH_SCHEMA_EXAMPLES_DIR=$GITHUB_WORKSPACE/DASHSchema

      - name: Build
        run: cmake --build build --parallel

      - name: Test
        env:
          # libdash has known leaks; report memory errors and UB, not leaks (yet)
          ASAN_OPTIONS: detect_leaks=0
          UBSAN_OPTIONS: print_stacktrace=1:halt_on_error=1
        run: ctest --test-dir build --output-on-failure --timeout 300

  windows:
    name: windows-latest / msvc / ${{ matrix.preset }}
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        preset: [windows-x64, windows-x86, windows-x86-bundled]

    steps:
      - uses: actions/checkout@v5

      - name: Check out DASHSchema (6th edition examples)
        uses: actions/checkout@v5
        with:
          repository: MPEGGroup/DASHSchema
          ref: 6th-Ed
          path: DASHSchema

      - name: Use the vcpkg installation of the runner
        if: matrix.preset != 'windows-x86-bundled'
        shell: pwsh
        run: echo "VCPKG_ROOT=$env:VCPKG_INSTALLATION_ROOT" >> $env:GITHUB_ENV

      - name: Cache vcpkg binary packages
        if: matrix.preset != 'windows-x86-bundled'
        uses: actions/cache@v4
        with:
          path: ~\AppData\Local\vcpkg\archives
          key: vcpkg-${{ matrix.preset }}-${{ hashFiles('libdash/vcpkg.json') }}
          restore-keys: vcpkg-${{ matrix.preset }}-

      - name: Install the Visual C++ 2010 runtime needed by the bundled libraries
        if: matrix.preset == 'windows-x86-bundled'
        run: choco install vcredist2010 -y --no-progress

      - name: Configure
        working-directory: libdash
        run: cmake --preset ${{ matrix.preset }} -DLIBDASH_BUILD_NETWORK_TEST=ON -DLIBDASH_SCHEMA_EXAMPLES_DIR=${{ github.workspace }}/DASHSchema

      - name: Build
        working-directory: libdash
        run: cmake --build --preset ${{ matrix.preset }} --parallel

      - name: Test
        working-directory: libdash
        run: ctest --preset ${{ matrix.preset }}

  cmake-minimum:
    name: ubuntu-latest / gcc / CMake 3.13 (minimum version)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Install dependencies and CMake 3.13
        run: |
          sudo apt-get update && sudo apt-get install -y libxml2-dev libcurl4-openssl-dev zlib1g-dev
          curl -sSL https://github.com/Kitware/CMake/releases/download/v3.13.5/cmake-3.13.5-Linux-x86_64.tar.gz | tar -xz -C "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/cmake-3.13.5-Linux-x86_64/bin" >> "$GITHUB_PATH"

      - name: Configure, build and test (without -S/-B or --test-dir)
        run: |
          cmake --version
          mkdir build && cd build
          cmake ../libdash -DCMAKE_BUILD_TYPE=Release
          cmake --build . -- -j2
          ctest --output-on-failure --timeout 300
