name: CI

on:
  push:
  pull_request:

jobs:
  build:
    name: ${{ matrix.os }} / ${{ matrix.compiler }} / ${{ matrix.build_type }}${{ matrix.sanitize && ' / sanitizers' || '' }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, compiler: gcc,   build_type: Release }
          - { os: ubuntu-latest, compiler: clang, build_type: Release }
          - { os: ubuntu-latest, compiler: clang, build_type: Debug, sanitize: true }
          - { os: macos-latest,  compiler: clang, build_type: Release }

    steps:
      - uses: actions/checkout@v5

      - name: Check out DASHSchema (6th edition examples)
        uses: actions/checkout@v5
        with:
          repository: MPEGGroup/DASHSchema
          ref: 6th-Ed
          path: DASHSchema

      - name: Install dependencies (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libxml2-dev libcurl4-openssl-dev zlib1g-dev

      - name: Configure
        run: |
          if [ "${{ matrix.compiler }}" = "gcc" ]; then export CXX=g++; else export CXX=clang++; fi
          FLAGS=""
          if [ "${{ matrix.sanitize }}" = "true" ]; then FLAGS="-fsanitize=address,undefined -fno-omit-frame-pointer"; fi
          cmake -S libdash -B build \
            -DCMAKE_BUILD_TYPE=${{ matrix.build_type }} \
            -DCMAKE_CXX_FLAGS="$FLAGS" \
            -DCMAKE_SHARED_LINKER_FLAGS="$FLAGS" \
            -DCMAKE_EXE_LINKER_FLAGS="$FLAGS" \
            -DLIBDASH_SCHEMA_EXAMPLES_DIR=$GITHUB_WORKSPACE/DASHSchema

      - name: Build
        run: cmake --build build --parallel

      - name: Test
        env:
          # libdash has known leaks; report memory errors and UB, not leaks (yet)
          ASAN_OPTIONS: detect_leaks=0
          UBSAN_OPTIONS: print_stacktrace=1:halt_on_error=1
        run: ctest --test-dir build --output-on-failure
